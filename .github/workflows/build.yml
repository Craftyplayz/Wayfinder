name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Minecraft 26.1.2 and this project's toolchain (build.gradle) require Java 25.
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # Uses the project's Gradle wrapper (and validates its checksum).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v5
        with:
          name: Wayfinder-build
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
